name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/daily-tracker-release.jks" \
            -storepass dailytracker \
            -keypass dailytracker \
            -alias daily-tracker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Daily Tracker, OU=Mobile, O=Daily Tracker, L=Unknown, ST=Unknown, C=US"
      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon -p android assembleRelease \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/daily-tracker-release.jks" \
            -PRELEASE_STORE_PASSWORD=dailytracker \
            -PRELEASE_KEY_ALIAS=daily-tracker \
            -PRELEASE_KEY_PASSWORD=dailytracker
      - uses: actions/upload-artifact@v4
        with:
          name: daily-tracker-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
